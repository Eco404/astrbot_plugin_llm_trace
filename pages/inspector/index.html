<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LLM Trace</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar glass">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg class="icon"><use href="#icon-activity"></use></svg>
          </span>
          <div class="brand-copy">
            <p class="kicker">Observability</p>
            <h1>LLM Trace</h1>
            <p class="subtitle">请求、工具与响应时间线</p>
          </div>
        </div>

        <section class="status-rail" aria-label="运行状态">
          <div class="status-cell connection-cell">
            <span class="status-label">连接</span>
            <strong id="connectionStatus" data-state="pending">
              <span class="status-dot" aria-hidden="true"></span>
              <span id="connectionLabel">连接中</span>
            </strong>
          </div>
          <div class="status-cell">
            <span class="status-label">待写入</span>
            <strong id="queueSize">-</strong>
          </div>
          <div class="status-cell">
            <span class="status-label">丢弃 / 错误</span>
            <strong id="droppedRecords">-</strong>
          </div>
          <div class="status-cell privacy-cell">
            <span class="status-label">数据策略</span>
            <strong id="privacyMode">-</strong>
          </div>
        </section>

        <div class="toolbar" aria-label="Trace 控制">
          <label class="capture-control">
            <span class="capture-copy">
              <strong id="captureLabel">采集关闭</strong>
              <span>请求记录</span>
            </span>
            <input id="captureToggle" type="checkbox" role="switch" />
            <span class="switch-track" aria-hidden="true"><span></span></span>
          </label>
          <button
            id="refreshButton"
            class="icon-button"
            type="button"
            aria-label="刷新 Trace"
            data-tooltip="刷新"
          >
            <svg class="icon"><use href="#icon-refresh"></use></svg>
          </button>
          <button
            id="clearButton"
            class="icon-button danger-button"
            type="button"
            aria-label="清空全部 Trace"
            aria-haspopup="dialog"
            data-tooltip="清空全部"
          >
            <svg class="icon"><use href="#icon-trash"></use></svg>
          </button>
        </div>
      </header>

      <main class="workspace glass">
        <aside class="run-panel" aria-label="Trace 记录">
          <div class="panel-heading">
            <div>
              <p class="section-label">Runs</p>
              <h2>最近记录</h2>
            </div>
            <span id="runCount" class="count-badge" aria-label="记录数量">0</span>
          </div>

          <label class="search-box">
            <span class="sr-only">搜索 Trace</span>
            <svg class="icon" aria-hidden="true"><use href="#icon-search"></use></svg>
            <input
              id="searchInput"
              type="search"
              inputmode="search"
              autocomplete="off"
              placeholder="搜索模型、Provider 或会话"
            />
          </label>

          <div id="runList" class="run-list" aria-live="polite" aria-busy="true"></div>
        </aside>

        <section class="detail-panel" aria-label="Trace 详情">
          <div id="emptyState" class="empty-state">
            <span class="empty-icon" aria-hidden="true">
              <svg class="icon"><use href="#icon-list-tree"></use></svg>
            </span>
            <h2>选择一条记录</h2>
            <p>在左侧展开运行记录，再选择一个时间线事件查看详情。</p>
          </div>

          <div id="traceDetail" class="trace-detail hidden">
            <header class="detail-heading">
              <button
                id="backButton"
                class="icon-button back-button"
                type="button"
                aria-label="返回 Trace 列表"
              >
                <svg class="icon"><use href="#icon-arrow-left"></use></svg>
              </button>

              <div class="detail-identity">
                <div class="detail-title-row">
                  <h2 id="detailTitle">Trace</h2>
                  <span id="detailStatus" class="status-badge" data-status="running">进行中</span>
                </div>
                <p id="detailMeta" class="detail-meta"></p>
                <p id="detailRunId" class="run-id"></p>
              </div>

              <div class="delete-wrap">
                <button
                  id="deleteButton"
                  class="icon-button danger-button"
                  type="button"
                  title="删除当前 Trace"
                  aria-label="删除当前 Trace"
                  aria-expanded="false"
                  aria-controls="deletePopover"
                  aria-haspopup="dialog"
                  data-tooltip="删除当前 Trace"
                >
                  <svg class="icon"><use href="#icon-trash"></use></svg>
                </button>

                <section
                  id="deletePopover"
                  class="delete-popover hidden"
                  role="dialog"
                  aria-labelledby="deleteTitle"
                  aria-describedby="deleteMessage"
                >
                  <div class="confirmation-heading">
                    <span class="danger-mark" aria-hidden="true">
                      <svg class="icon"><use href="#icon-alert"></use></svg>
                    </span>
                    <div>
                      <h3 id="deleteTitle">删除这条 Trace？</h3>
                      <p id="deleteMessage">请求快照、事件和响应数据都会被永久删除。</p>
                    </div>
                  </div>
                  <p id="deleteError" class="confirmation-error hidden" role="alert"></p>
                  <div class="confirmation-actions">
                    <button id="deleteCancel" class="button secondary" type="button">取消</button>
                    <button id="deleteAccept" class="button danger solid" type="button">删除 Trace</button>
                  </div>
                </section>
              </div>
            </header>

            <section id="charStats" class="char-stats" aria-label="字符统计"></section>

            <section class="mobile-timeline-region" aria-labelledby="mobileTimelineTitle">
              <div class="region-heading">
                <div>
                  <p class="section-label">Timeline</p>
                  <h3 id="mobileTimelineTitle">事件时间线</h3>
                </div>
                <span id="mobileEventCount" class="region-count">0 个事件</span>
              </div>
              <div id="mobileTimeline" class="timeline"></div>
            </section>

            <section class="payload-tool" aria-labelledby="payloadTitle">
              <div class="payload-heading">
                <div>
                  <p class="section-label">Payload</p>
                  <h3 id="payloadTitle">选择时间线事件</h3>
                </div>
                <button
                  id="copyButton"
                  class="icon-button"
                  type="button"
                  aria-label="复制事件 JSON"
                  data-tooltip="复制 JSON"
                  disabled
                >
                  <svg class="icon"><use href="#icon-copy"></use></svg>
                </button>
              </div>
              <div id="payloadEmpty" class="payload-empty">
                <span class="empty-icon" aria-hidden="true">
                  <svg class="icon"><use href="#icon-list-tree"></use></svg>
                </span>
                <h3>尚未选择事件</h3>
                <p>从左侧展开的时间线中选择一项。</p>
              </div>
              <pre id="payloadView" class="hidden" tabindex="0">{}</pre>
            </section>
          </div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <div id="clearOverlay" class="confirm-overlay hidden">
      <section
        id="clearDialog"
        class="confirm-dialog glass"
        role="dialog"
        aria-modal="true"
        aria-labelledby="clearTitle"
        aria-describedby="clearMessage"
      >
        <div class="confirmation-heading">
          <span class="danger-mark" aria-hidden="true">
            <svg class="icon"><use href="#icon-alert"></use></svg>
          </span>
          <div>
            <p class="section-label danger-label">Destructive action</p>
            <h2 id="clearTitle">清空全部 Trace？</h2>
          </div>
        </div>
        <p id="clearMessage" class="confirm-message">当前保存的所有请求、工具事件和响应记录都会被永久删除。</p>
        <p id="clearError" class="confirmation-error hidden" role="alert"></p>
        <div class="confirmation-actions">
          <button id="clearCancel" class="button secondary" type="button">取消</button>
          <button id="clearAccept" class="button danger solid" type="button">清空全部</button>
        </div>
      </section>
    </div>

    <svg class="icon-defs" aria-hidden="true">
      <symbol id="icon-activity" viewBox="0 0 24 24">
        <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
      </symbol>
      <symbol id="icon-refresh" viewBox="0 0 24 24">
        <path d="M21 12a9 9 0 0 0-15-6.7L3 8"></path>
        <path d="M3 3v5h5"></path>
        <path d="M3 12a9 9 0 0 0 15 6.7L21 16"></path>
        <path d="M16 16h5v5"></path>
      </symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24">
        <path d="M3 6h18"></path>
        <path d="M8 6V4h8v2"></path>
        <path d="M19 6l-1 14H6L5 6"></path>
        <path d="M10 11v5"></path>
        <path d="M14 11v5"></path>
      </symbol>
      <symbol id="icon-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </symbol>
      <symbol id="icon-list-tree" viewBox="0 0 24 24">
        <path d="M21 12h-8"></path>
        <path d="M21 6H8"></path>
        <path d="M21 18h-8"></path>
        <path d="M3 6h.01"></path>
        <path d="M8 12H3"></path>
        <path d="M8 18H3"></path>
      </symbol>
      <symbol id="icon-arrow-left" viewBox="0 0 24 24">
        <path d="m15 18-6-6 6-6"></path>
      </symbol>
      <symbol id="icon-chevron-down" viewBox="0 0 24 24">
        <path d="m6 9 6 6 6-6"></path>
      </symbol>
      <symbol id="icon-copy" viewBox="0 0 24 24">
        <rect width="14" height="14" x="8" y="8" rx="2"></rect>
        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
      </symbol>
      <symbol id="icon-alert" viewBox="0 0 24 24">
        <path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3Z"></path>
        <path d="M12 9v4"></path>
        <path d="M12 17h.01"></path>
      </symbol>
    </svg>

    <script type="module" src="./app.js"></script>
  </body>
</html>
